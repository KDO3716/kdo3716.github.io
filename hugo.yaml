# Hugo configuration file
baseURL: "https://kdo3716.github.io/"
title: KangDongOh | Game Design Blog
languageCode: ko
defaultContentLanguage: ko
enableRobotsTXT: true

cascade:
  sidebar:
    hide: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Project
      pageRef: /project
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: Search
      weight: 4
      params:
        type: search

params:
  description:
    "게임 기획자 강동오의 포트폴리오 사이트입니다."
  images:
    - "images/IDphoto_Preview.png"

  navbar:
    displayTitle: true
    displayLogo: true

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false

